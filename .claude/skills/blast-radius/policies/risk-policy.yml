# Risk policy read by the blast-radius skill.
# Agents must never edit this file. Only a human changes it (see .github/CODEOWNERS).

# Paths that raise the risk. Glob patterns, matched against changed files.
protected_paths:
  critical:   # any match forces the score to at least `critical_floor` (level `high`)
    - ".github/**"
    - ".factory/**"
    - ".claude/agents/**"
    - "**/migrations/**"
    - "**/*.sql"
    - "**/auth/**"
    - "**/payment*/**"
    - "**/secrets*"
    - "**/.env*"
  sensitive:  # each matching changed file adds `scoring.signals.sensitive_path` points
    - "package.json"
    - "package-lock.json"
    - "pnpm-lock.yaml"
    - "yarn.lock"
    - "requirements*.txt"
    - "pyproject.toml"
    - "go.mod"
    - "Cargo.toml"
    - "Dockerfile*"
    - "**/config/**"
    - ".claude/skills/**"

# Diff size thresholds, counted as added plus removed lines.
# Crossing a medium threshold adds `size_medium` points, a high threshold adds
# `size_high` points instead (never both). Either lines or files may trigger it.
size:
  medium_lines: 150
  high_lines: 500
  medium_files: 10
  high_files: 25

# HOW THE SCORE IS CALCULATED
# Every signal below is worth points on the final 0-100 scale.
#   score = sum of all signal points, capped at 100
# If any `critical` path matched, the score is at least `critical_floor`.
# The level is read from `levels` using the final score.
#
# Signals marked "judged" are decided by the skill from the diff and the
# surrounding code, and only count when there is clear evidence.
scoring:
  max_score: 100
  signals:
    size_medium: 15           # diff reaches a medium threshold in `size`
    size_high: 40             # diff reaches a high threshold in `size` (instead of size_medium)
    sensitive_path: 10        # per changed file matching `sensitive`
    many_dependents: 25       # judged: touched code is used from 10+ places
    untested_code: 25         # judged: changed code has no tests covering it
    irreversible: 40          # judged: migration, public API break or data deletion
    security_medium: 30       # judged: touches security-relevant behaviour
    compliance_review: 10     # judged: needs a compliance or legal look

# Lowest score when a critical path matched (equals the start of `high`).
critical_floor: 67

# Score bands (inclusive).
levels:
  low: [0, 33]
  medium: [34, 66]
  high: [67, 100]
